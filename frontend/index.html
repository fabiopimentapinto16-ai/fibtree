<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Olho de Deus - Santo Graal</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="map"></div>
    <div class="panel">
        <h2>OLHO DE DEUS</h2>
        <button onclick="ativarGPS()">📍 ATIVAR GPS</button>
        <input type="number" id="lat" placeholder="Latitude" step="0.000001">
        <input type="number" id="lng" placeholder="Longitude" step="0.000001">
        <button id="btn-analisar" class="primary" onclick="analisar()">🔍 ANALISAR POTENCIAL</button>
        <div id="resultado"></div>
        <hr>
        <button class="btn" onclick="abrirHistorico()" style="color:#6496ff;border-color:#6496ff;">📜 HISTÓRICO</button>
        <button class="btn" onclick="exportarCSV()" style="color:#00c864;border-color:#00c864;">📊 EXPORTAR CSV</button>
        <button class="btn" onclick="ativarModoAmostra()" style="color:#c864ff;border-color:#c864ff;">📍 MARCAR AMOSTRA</button>
        <button class="btn" onclick="toggleRotaOSRM()" style="color:#ffff00;border-color:#ffff00;">🛣️ ROTA OSRM</button>
        <button onclick="abrir3D()" style="color:#ffcc00; border-color:#ffcc00;">📦 SIMULAÇÃO 3D</button>
        <button onclick="gerarPDF()">📄 GERAR RELATÓRIO PDF</button>
    </div>
    <div id="modalHistorico" class="modal"><div class="modal-content"><span class="close" onclick="fecharModal('modalHistorico')">&times;</span><h2>Histórico de Análises</h2><div id="listaHistorico"></div></div></div>
    <div id="modal3D" class="modal"><div class="modal-content" style="height: 85%; display: flex; flex-direction: column;"><span class="close" onclick="fecharModal('modal3D')">&times;</span><h2>Simulação de Perfil 3D</h2><div id="canvas3d" style="flex:1; background:#000; border-radius:8px;"></div></div></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
