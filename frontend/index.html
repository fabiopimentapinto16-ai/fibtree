<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GRAOS DE OURO</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root { --cyan: #00f0ff; --blue: #0066ff; --dark: #05080f; --darker: #020408; --glass: rgba(10, 20, 35, 0.85); --border: rgba(0, 240, 255, 0.3); --green: #00ff88; --yellow: #ffcc00; --red: #ff3355; --orange: #ff6400; }
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: 'Rajdhani', sans-serif; background: var(--darker); color: #fff; overflow: hidden; touch-action: manipulation; }
body.modo-claro { --darker: #f0f0f0; --dark: #e0e0e0; --glass: rgba(255,255,255,0.9); color: #111; }
#map { width: 100%; height: 100vh; z-index: 1; }
.hud { position: fixed; top: 20px; left: 20px; z-index: 1000; background: var(--glass); backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 8px; padding: 12px 18px; font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: 1px; }
.hud .dot { display: inline-block; width: 8px; height: 8px; background: var(--green); border-radius: 50%; margin-right: 8px; animation: pulse 1.5s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.panel { position: fixed; top: 0; right: 0; width: 420px; height: 100vh; background: var(--glass); backdrop-filter: blur(20px); border-left: 1px solid var(--border); z-index: 1000; overflow-y: auto; padding: 25px; }
.panel-header { border-bottom: 1px solid var(--border); padding-bottom: 18px; margin-bottom: 20px; }
.panel-header .logo { font-family: 'Orbitron'; font-size: 22px; font-weight: 900; color: var(--yellow); text-shadow: 0 0 20px var(--yellow); letter-spacing: 3px; }
.panel-header .subtitle { font-size: 12px; color: rgba(255,255,255,0.5); margin-top: 5px; letter-spacing: 2px; text-transform: uppercase; }
.btn { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); background: rgba(0, 240, 255, 0.05); color: var(--cyan); font-family: 'Orbitron'; font-size: 12px; font-weight: 700; letter-spacing: 1px; cursor: pointer; border-radius: 6px; transition: all 0.3s; }
.btn:hover { background: rgba(0, 240, 255, 0.15); box-shadow: 0 0 20px rgba(0,240,255,0.4); }
.btn.primary { background: rgba(0, 240, 255, 0.15); border-color: var(--cyan); }
.btn.green { background: rgba(0,255,136,0.1); border-color: var(--green); color: var(--green); }
.btn.yellow { background: rgba(255,204,0,0.1); border-color: var(--yellow); color: var(--yellow); }
.btn.orange { background: rgba(255,100,0,0.15); border-color: var(--orange); color: var(--orange); }
input { width: 100%; padding: 10px; margin-bottom: 10px; background: rgba(0,0,0,0.4); border: 1px solid var(--border); border-radius: 6px; color: #fff; font-family: 'Rajdhani'; font-size: 14px; outline: none; }
.result { margin-top: 20px; display: none; }
.score-display { text-align: center; padding: 20px; margin-bottom: 15px; background: rgba(0,0,0,0.3); border-radius: 10px; border: 1px solid var(--border); }
.score-display .value { font-family: 'Orbitron'; font-size: 48px; font-weight: 900; color: var(--cyan); text-shadow: 0 0 30px var(--cyan); }
.score-display .classif { font-size: 14px; letter-spacing: 2px; margin-top: 5px; }
.score-display .type { font-size: 16px; margin-top: 8px; font-weight: 700; }
.evidence-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 3px solid var(--yellow); }
.evidence-box.etr { border-left-color: var(--cyan); }
.evidence-box.sigmine { border-left-color: var(--green); }
.evidence-box h4 { font-family: 'Orbitron'; font-size: 11px; color: var(--yellow); margin-bottom: 8px; }
.evidence-box.etr h4 { color: var(--cyan); }
.evidence-box.sigmine h4 { color: var(--green); }
.evidence-box ul { list-style: none; }
.evidence-box li { font-size: 12px; padding: 3px 0; color: rgba(255,255,255,0.8); }
.evidence-box li::before { content: '> '; color: var(--cyan); }
.loading { display: none; text-align: center; padding: 20px; }
.spinner { width: 40px; height: 40px; border: 3px solid rgba(0,240,255,0.1); border-top-color: var(--cyan); border-radius: 50%; margin: 0 auto; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== ANDROID ADAPTATIVO ===== */
@media (max-width: 768px) {
    .panel { width: 100%; height: 55vh; top: 45vh; border-left: none; border-top: 2px solid var(--cyan); padding: 15px; border-radius: 20px 20px 0 0; box-shadow: 0 -10px 40px rgba(0, 240, 255, 0.2); }
    .panel::before { content: ''; display: block; width: 50px; height: 4px; background: var(--cyan); border-radius: 2px; margin: 0 auto 12px; opacity: 0.5; }
    .hud { top: 10px; left: 10px; padding: 8px 12px; font-size: 9px; }
    .btn { padding: 14px; font-size: 12px; min-height: 48px; }
    input { padding: 12px; font-size: 16px; min-height: 44px; }
    .panel-header .logo { font-size: 16px; }
    .score-display .value { font-size: 42px; }
    .spinner { width: 50px; height: 50px; border-width: 4px; }
}
@media (max-width: 480px) {
    .panel { height: 58vh; top: 42vh; padding: 12px; }
    .btn { font-size: 11px; padding: 12px; }
    .score-display .value { font-size: 36px; }
}
.leaflet-container { touch-action: pan-x pan-y; }
</style>
</head>
<body>
<div id="map"></div>
<div class="hud"><span class="dot"></span>SISTEMA ATIVO<div style="margin-top: 8px; color: var(--cyan);" id="hud-coord">LAT: -- | LNG: --</div></div>
<div class="panel">
    <div class="panel-header">
        <div class="logo">GRAOS DE OURO</div>
        <div class="subtitle">Prospeccao Mineral - Ouro + Terras Raras</div>
    </div>
    <button class="btn" onclick="ativarGPS()">ATIVAR/PARAR GPS</button>
    <input type="number" id="lat" placeholder="Latitude" step="0.000001">
    <input type="number" id="lng" placeholder="Longitude" step="0.000001">
    <button class="btn primary" onclick="analisar()">ANALISAR POTENCIAL</button>
    <button class="btn" onclick="alternarMapa()">ALTERNAR MAPA (HIBRIDO/SATELITE)</button>
    <button class="btn" onclick="toggleModo()">ALTERNAR MODO ESCURO/CLARO</button>
    <div class="loading" id="loading"><div class="spinner"></div><div style="margin-top: 10px; color: var(--cyan); font-size: 12px;">ANALISANDO...</div></div>
    <div class="result" id="result"></div>
</div>

<div id="modal3d" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(2,4,8,0.95); z-index:9999; justify-content:center; align-items:center;">
    <div style="width:90%; max-width:900px; height:85%; background:#0a1420; border:1px solid #00f0ff; border-radius:12px; padding:20px; position:relative; display:flex; flex-direction:column;">
        <button onclick="fecharSimulacao3D()" style="position:absolute; top:15px; right:15px; background:transparent; border:1px solid #00f0ff; color:#00f0ff; width:35px; height:35px; border-radius:50%; cursor:pointer; font-size:18px;">X</button>
        <h2 style="font-family:'Orbitron'; color:#00f0ff; font-size:16px; margin-bottom:10px;">SIMULACAO 3D DO SUBSOLO (0 a 2 metros)</h2>
        <p id="aviso3d" style="font-size:11px; color:#ffcc00; margin-bottom:10px;"></p>
        <div id="canvas3d" style="flex:1; background:#020408; border-radius:8px; overflow:hidden;"></div>
        <div id="legenda3d" style="margin-top:10px; display:flex; flex-wrap:wrap; gap:10px; font-size:11px;"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
let map, marker, circle, gpsWatchId = null;
let satLayer, hibridoLayer, camadaAtual = "hibrido";
let cena3d, camera3d, renderizador3d, animacaoId;
let analisandoEmAndamento = false;
let primeiraPosicaoGPS = true;
let gpsMarker = null;
let gpsAtivo = false;

function initMap() {
    map = L.map('map').setView([-15, -50], 4);
    hibridoLayer = L.layerGroup([
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri', maxZoom: 19 }),
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png', { attribution: 'CartoDB', maxZoom: 19, opacity: 0.8 })
    ]).addTo(map);
    satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri', maxZoom: 19 });
    map.on('click', function(e) {
        const lat = e.latlng.lat.toFixed(6);
        const lng = e.latlng.lng.toFixed(6);
        document.getElementById('lat').value = lat;
        document.getElementById('lng').value = lng;
        document.getElementById('hud-coord').innerText = 'LAT: ' + lat + ' | LNG: ' + lng;
        // NÃO chama analisar() automaticamente. Usuário precisa clicar no botão.
    });
}

function alternarMapa() {
    if (camadaAtual === "hibrido") {
        map.removeLayer(hibridoLayer); satLayer.addTo(map); camadaAtual = "satelite";
    } else {
        map.removeLayer(satLayer); hibridoLayer.addTo(map); camadaAtual = "hibrido";
    }
}

function toggleModo() {
    document.body.classList.toggle('modo-claro');
    const modo = document.body.classList.contains('modo-claro') ? 'claro' : 'escuro';
    localStorage.setItem('modo', modo);
}

function ativarGPS() {
    if (!navigator.geolocation) { alert('GPS nao suportado'); return; }
    
    // Se já está ativo, desativar
    if (gpsAtivo) {
        pararGPS();
        return;
    }
    
    gpsAtivo = true;
    primeiraPosicaoGPS = true;
    
    gpsWatchId = navigator.geolocation.watchPosition(function(pos) {
        const lat = pos.coords.latitude.toFixed(6);
        const lng = pos.coords.longitude.toFixed(6);
        
        // Atualizar campos e HUD (SEMPRE)
        document.getElementById('lat').value = lat;
        document.getElementById('lng').value = lng;
        document.getElementById('hud-coord').innerText = 'LAT: ' + lat + ' | LNG: ' + lng;
        
        // Atualizar marcador verde (SEMPRE)
        if (gpsMarker) {
            map.removeLayer(gpsMarker);
        }
        const iconeGPS = L.divIcon({
            html: '<div style="background:#00ff88; width:18px; height:18px; border-radius:50%; border:3px solid #fff; box-shadow: 0 0 20px #00ff88;"></div>',
            className: '',
            iconSize: [18, 18]
        });
        gpsMarker = L.marker([lat, lng], {icon: iconeGPS}).addTo(map);
        gpsMarker.bindPopup('<b>Sua localizacao</b><br>' + lat + ', ' + lng);
        
        // CENTRALIZAR O MAPA APENAS NA PRIMEIRA POSIÇÃO
        if (primeiraPosicaoGPS) {
            map.setView([lat, lng], 15);
            primeiraPosicaoGPS = false;
            console.log('📡 Primeira posição: mapa centralizado');
            alert('GPS ativado! O mapa foi centralizado na sua posição.

Agora você pode mover o mapa livremente.');
        }
        // Depois da primeira vez, NÃO mexe no mapa
        
    }, function(err) {
        gpsAtivo = false;
        alert('Erro GPS: ' + err.message);
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
}

function pararGPS() {
    if (gpsWatchId) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
    }
    if (gpsMarker) {
        map.removeLayer(gpsMarker);
        gpsMarker = null;
    }
    gpsAtivo = false;
    alert('GPS desativado. Voce pode mover o mapa livremente.');
}

async function analisar() {
    // === TRAVA: Se já está analisando, ignora ===
    if (analisandoEmAndamento) {
        console.log('Analise em andamento. Ignorando nova solicitacao.');
        return;
    }
    
    const lat = parseFloat(document.getElementById('lat').value);
    const lng = parseFloat(document.getElementById('lng').value);
    if (isNaN(lat) || isNaN(lng)) { alert('Digite coordenadas ou clique no mapa'); return; }
    
    analisandoEmAndamento = true;
    document.getElementById('loading').style.display = 'block';
    document.getElementById('result').style.display = 'none';
    
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 60000);
    
    try {
        const resposta = await fetch('/api/analisar', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({lat: lat, lng: lng, usar_satelite: true}),
            signal: controller.signal
        });
        clearTimeout(timeoutId);
        if (!resposta.ok) throw new Error('Erro ' + resposta.status);
        const dados = await resposta.json();
        document.getElementById('loading').style.display = 'none';
        renderizarResultado(dados, lat, lng);
    } catch (e) {
        clearTimeout(timeoutId);
        document.getElementById('loading').style.display = 'none';
        if (e.name === 'AbortError') {
            alert('Analise demorou mais de 60s. O servidor pode estar acordando. Tente de novo.');
        } else {
            alert('Erro: ' + e.message);
        }
    } finally {
        // === SEMPRE LIBERA A TRAVA, mesmo se der erro ===
        analisandoEmAndamento = false;
    }
}

function renderizarResultado(dados, lat, lng) {
    const r = document.getElementById('result');
    let corClassif = dados.score_final >= 70 ? 'var(--green)' : dados.score_final >= 45 ? 'var(--yellow)' : 'var(--red)';
    let iconeTipo = dados.tipo_principal === 'ouro' ? 'OURO' : 'TERRAS RARAS';
    let html = '<div class="score-display"><div class="value" style="color:' + corClassif + ';">' + dados.score_final + '</div>';
    html += '<div class="classif" style="color:' + corClassif + ';">' + dados.classificacao + '</div>';
    html += '<div class="type">' + iconeTipo + '</div>';
    html += '<div style="font-size:11px; opacity:0.6; margin-top:8px;">Ouro: ' + dados.score_ouro + ' | ETR: ' + dados.score_etr + '</div></div>';
    if (dados.evidencias_ouro && dados.evidencias_ouro.length > 0) { html += '<div class="evidence-box"><h4>EVIDENCIAS OURO</h4><ul>'; dados.evidencias_ouro.forEach(e => html += '<li>' + e + '</li>'); html += '</ul></div>'; }
    if (dados.evidencias_etr && dados.evidencias_etr.length > 0) { html += '<div class="evidence-box etr"><h4>EVIDENCIAS TERRAS RARAS</h4><ul>'; dados.evidencias_etr.forEach(e => html += '<li>' + e + '</li>'); html += '</ul></div>'; }
    if (dados.pontos_sigmine && dados.pontos_sigmine.length > 0) { html += '<div class="evidence-box sigmine"><h4>PROCESSOS SIGMINE (15 km)</h4><ul>'; dados.pontos_sigmine.slice(0, 10).forEach(p => { html += '<li>' + p.processo + ' - ' + p.subs + ' (' + p.distancia_km + ' km)</li>'; }); html += '</ul></div>'; }
    html += '<button class="btn primary" onclick="gerarPDF()">GERAR RELATORIO PDF</button>';
    html += '<button class="btn green" onclick="abrirSimulacao3D()">VER SIMULACAO 3D DO SUBSOLO</button>';
    html += '<button class="btn yellow" onclick="gerarMemorial()">GERAR MEMORIAL DESCRITIVO</button>';
    html += '<button class="btn" onclick="exportarKML()">EXPORTAR KML</button>';
    html += '<button class="btn" onclick="abrirGoogleEarth()">ABRIR NO GOOGLE EARTH</button>';
    html += '<button class="btn orange" onclick="criarRota()">CRIAR ROTA ATE AQUI (GPS)</button>';
    if (dados.ponto_interesse) {
        html += '<button class="btn" onclick="irParaPontoInteresse()" style="background: rgba(255,215,0,0.15); border-color: #FFD700; color: #FFD700;">IR AO PONTO DE INTERESSE (' + dados.ponto_interesse.score + '%)</button>';
    }
    r.innerHTML = html;
    r.style.display = 'block';
    window.ultimaAnalise = dados;
    if (marker) map.removeLayer(marker);
    if (circle) map.removeLayer(circle);
    marker = L.marker([lat, lng]).addTo(map);
    circle = L.circle([lat, lng], {radius: 15000, color: corClassif, fillOpacity: 0.1}).addTo(map);
    map.setView([lat, lng], 11);
    if (dados.pontos_proximos) {
        dados.pontos_proximos.forEach(p => {
            let cor = p.tipo === 'ouro' ? '#ffcc00' : '#00f0ff';
            if (p.dentro) cor = '#ff3355';
            let ic = L.divIcon({ html: '<div style="background:' + cor + '; width:14px; height:14px; border-radius:50%; border:2px solid #fff;"></div>', className: '', iconSize: [14, 14] });
            L.marker([p.lat, p.lng], {icon: ic}).addTo(map).bindPopup(
                '<b>' + p.nome + '</b><br>' +
                'Tipo: ' + p.tipo.toUpperCase() + '<br>' +
                'Distancia: ' + p.distancia_km + ' km<br>' +
                '<button onclick="rotaPontoEspecifico(' + p.lat + ',' + p.lng + ')" style="margin-top:5px;padding:6px 10px;background:#ff6400;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:bold;">Criar Rota</button>'
            );
        });
    }
    if (dados.pontos_sigmine) {
        dados.pontos_sigmine.slice(0, 20).forEach(p => {
            let ic = L.divIcon({ html: '<div style="background:#00ff88; width:10px; height:10px; border-radius:50%; border:1px solid #fff;"></div>', className: '', iconSize: [10, 10] });
            L.marker([p.lat, p.lng], {icon: ic}).addTo(map).bindPopup(
                '<b>Processo: ' + p.processo + '</b><br>' +
                '<span style="color:#00ff88;font-weight:bold;">Substancia: ' + (p.subs || 'Nao informada') + '</span><br>' +
                'Fase: ' + (p.fase || 'Nao informada') + '<br>' +
                'Distancia: ' + p.distancia_km + ' km<br>' +
                'UF: ' + (p.uf || '-') + '<br>' +
                '<button onclick="rotaPontoEspecifico(' + p.lat + ',' + p.lng + ')" style="margin-top:8px;padding:8px 12px;background:#ff6400;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:bold;font-size:13px;">Criar Rota</button>'
            );
        });
    }

    // === MARCADOR DO PONTO DE INTERESSE ===
    if (dados.ponto_interesse) {
        const pi = dados.ponto_interesse;
        const corPI = pi.tipo === 'ouro' ? '#FFD700' : '#00FFFF';
        const iconePI = L.divIcon({
            html: '<div style="background:' + corPI + '; width:24px; height:24px; border-radius:50%; border:3px solid #fff; box-shadow: 0 0 20px ' + corPI + '; animation: pulse 1.5s infinite;"></div>',
            className: '',
            iconSize: [24, 24]
        });
        L.marker([pi.lat, pi.lng], {icon: iconePI}).addTo(map).bindPopup(
            '<b style="color:' + corPI + ';">🎯 PONTO DE INTERESSE</b><br>' +
            '<b>Score:</b> ' + pi.score + '%<br>' +
            '<b>Motivo:</b> ' + pi.motivo + '<br>' +
            '<b>Distância:</b> ' + (pi.distancia_km || 0) + ' km<br>' +
            '<b>Coordenada:</b> ' + pi.lat.toFixed(6) + ', ' + pi.lng.toFixed(6) + '<br>' +
            '<button onclick="rotaPontoEspecifico(' + pi.lat + ',' + pi.lng + ')" style="margin-top:8px;padding:8px 12px;background:#ff6400;color:#fff;border:none;border-radius:4px;cursor:pointer;font-weight:bold;">Criar Rota</button>'
        ).openPopup();
    }

}

function irParaPontoInteresse() {
    if (!window.ultimaAnalise || !window.ultimaAnalise.ponto_interesse) {
        alert('Nenhum ponto de interesse calculado.');
        return;
    }
    const pi = window.ultimaAnalise.ponto_interesse;
    map.setView([pi.lat, pi.lng], 15);
}

function gerarPDF() {
    if (!window.ultimaAnalise) { alert('Faca uma analise primeiro'); return; }
    fetch('/api/gerar-pdf', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(window.ultimaAnalise) })
    .then(r => r.blob()).then(blob => { const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'relatorio_graos_de_ouro.pdf'; a.click(); })
    .catch(e => alert('Erro: ' + e.message));
}

function gerarMemorial() {
    if (!window.ultimaAnalise) { alert('Faca uma analise primeiro'); return; }
    fetch('/api/gerar-memorial', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(window.ultimaAnalise) })
    .then(r => r.blob()).then(blob => { const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'memorial_descritivo.pdf'; a.click(); })
    .catch(e => alert('Erro: ' + e.message));
}

function exportarKML() {
    if (!window.ultimaAnalise) { alert('Faca uma analise primeiro'); return; }
    fetch('/api/exportar-kml', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(window.ultimaAnalise) })
    .then(r => r.blob()).then(blob => { const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'graos_de_ouro.kml'; a.click(); })
    .catch(e => alert('Erro: ' + e.message));
}

function abrirGoogleEarth() {
    const lat = parseFloat(document.getElementById('lat').value);
    const lng = parseFloat(document.getElementById('lng').value);
    if (isNaN(lat) || isNaN(lng)) { alert('Faca uma analise primeiro'); return; }
    window.open('https://earth.google.com/web/@' + lat + ',' + lng + ',1000a,1000d,35y,0h,0t,0r', '_blank');
}

function criarRota() {
    const lat = parseFloat(document.getElementById('lat').value);
    const lng = parseFloat(document.getElementById('lng').value);
    if (isNaN(lat) || isNaN(lng)) { alert('Faca uma analise primeiro'); return; }
    if (!navigator.geolocation) { alert('GPS nao suportado'); return; }
    document.getElementById('loading').style.display = 'block';
    navigator.geolocation.getCurrentPosition(function(pos) {
        document.getElementById('loading').style.display = 'none';
        const origemLat = pos.coords.latitude.toFixed(6);
        const origemLng = pos.coords.longitude.toFixed(6);
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        let url;
        if (isMobile) {
            url = 'https://www.google.com/maps/dir/?api=1&origin=' + origemLat + ',' + origemLng + '&destination=' + lat + ',' + lng + '&travelmode=driving';
        } else {
            url = 'https://www.google.com/maps/dir/' + origemLat + ',' + origemLng + '/' + lat + ',' + lng;
        }
        window.open(url, '_blank');
    }, function(err) {
        document.getElementById('loading').style.display = 'none';
        alert('Erro GPS: ' + err.message);
    }, { enableHighAccuracy: true, timeout: 15000 });
}

function rotaPontoEspecifico(destLat, destLng) {
    if (!navigator.geolocation) { alert('GPS nao suportado'); return; }
    document.getElementById('loading').style.display = 'block';
    navigator.geolocation.getCurrentPosition(function(pos) {
        document.getElementById('loading').style.display = 'none';
        const origemLat = pos.coords.latitude.toFixed(6);
        const origemLng = pos.coords.longitude.toFixed(6);
        const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
        let url;
        if (isMobile) {
            url = 'https://www.google.com/maps/dir/?api=1&origin=' + origemLat + ',' + origemLng + '&destination=' + destLat + ',' + destLng + '&travelmode=driving';
        } else {
            url = 'https://www.google.com/maps/dir/' + origemLat + ',' + origemLng + '/' + destLat + ',' + destLng;
        }
        window.open(url, '_blank');
    }, function(err) {
        document.getElementById('loading').style.display = 'none';
        alert('Erro GPS: ' + err.message);
    }, { enableHighAccuracy: true, timeout: 15000 });
}

function abrirSimulacao3D() {
    const lat = parseFloat(document.getElementById('lat').value);
    const lng = parseFloat(document.getElementById('lng').value);
    if (isNaN(lat) || isNaN(lng)) { alert('Faca uma analise primeiro'); return; }
    document.getElementById('modal3d').style.display = 'flex';
    fetch('/api/simular-subsolo', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({lat: lat, lng: lng, resultado_analise: window.ultimaAnalise}) })
    .then(r => r.json()).then(dados => { document.getElementById('aviso3d').innerText = 'AVISO: ' + dados.aviso; montarBloco3D(dados); })
    .catch(e => alert('Erro: ' + e.message));
}

function fecharSimulacao3D() {
    document.getElementById('modal3d').style.display = 'none';
    if (animacaoId) cancelAnimationFrame(animacaoId);
}

function montarBloco3D(dados) {
    const container = document.getElementById('canvas3d');
    const largura = container.clientWidth;
    const altura = container.clientHeight;
    container.innerHTML = '';
    cena3d = new THREE.Scene();
    cena3d.background = new THREE.Color(0x020408);
    camera3d = new THREE.PerspectiveCamera(45, largura/altura, 0.1, 1000);
    camera3d.position.set(8, 6, 10); camera3d.lookAt(0, 0, 0);
    renderizador3d = new THREE.WebGLRenderer({antialias: true});
    renderizador3d.setSize(largura, altura);
    container.appendChild(renderizador3d.domElement);
    cena3d.add(new THREE.AmbientLight(0xffffff, 0.6));
    const luz = new THREE.DirectionalLight(0xffffff, 0.8);
    luz.position.set(10, 15, 10); cena3d.add(luz);
    const escala = 2; let yAtual = 0;
    dados.camadas.forEach((camada) => {
        const espessura = (camada.espessura_cm / 100) * escala;
        const geometria = new THREE.BoxGeometry(6, espessura, 6);
        const cor = new THREE.Color(camada.cor);
        const isMin = camada.tipo.includes('MINERALIZADA');
        const material = new THREE.MeshPhongMaterial({ color: cor, transparent: true, opacity: 0.9, emissive: cor, emissiveIntensity: isMin ? 0.5 : 0.1 });
        const bloco = new THREE.Mesh(geometria, material);
        bloco.position.y = yAtual + espessura/2;
        cena3d.add(bloco);
        const arestas = new THREE.EdgesGeometry(geometria);
        cena3d.add(new THREE.LineSegments(arestas, new THREE.LineBasicMaterial({color: 0x00f0ff})).translateY(yAtual + espessura/2));
        yAtual += espessura;
    });
    const alturaTotal = yAtual;
    cena3d.children.forEach(obj => { if (obj.position && obj.geometry) obj.position.y -= alturaTotal/2; });
    const grid = new THREE.GridHelper(15, 15, 0x00f0ff, 0x003344);
    grid.position.y = -alturaTotal/2 - 0.1;
    cena3d.add(grid);
    const legenda = document.getElementById('legenda3d');
    legenda.innerHTML = dados.camadas.map(c => {
        const isMin = c.tipo.includes('MINERALIZADA');
        const corTexto = isMin ? c.cor : '#ccc';
        const brilho = isMin ? 'box-shadow: 0 0 10px ' + c.cor + '; border: 2px solid ' + c.cor + ';' : 'border:1px solid #00f0ff;';
        return '<div style="display:flex; align-items:center; gap:5px;"><div style="width:15px; height:15px; background:' + c.cor + '; ' + brilho + '"></div><span style="color:' + corTexto + '; font-weight:' + (isMin ? '700' : '400') + ';">' + c.tipo + ' (' + c.profundidade_cm + '-' + (c.profundidade_cm + c.espessura_cm) + 'cm)</span></div>';
    }).join('');
    function animar() {
        animacaoId = requestAnimationFrame(animar);
        cena3d.rotation.y += 0.005;
        renderizador3d.render(cena3d, camera3d);
    }
    animar();
}

window.onload = function() {
    initMap();
    if (localStorage.getItem('modo') === 'claro') {
        document.body.classList.add('modo-claro');
    }
};
</script>
