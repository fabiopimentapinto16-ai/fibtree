<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olho de Deus</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="map"></div>
    <div class="panel">
        <h2>OLHO DE DEUS</h2>
        <button onclick="ativarGPS()">📍 ATIVAR GPS</button>
        <input type="number" id="lat" placeholder="Latitude" step="0.000001">
        <input type="number" id="lng" placeholder="Longitude" step="0.000001">
        <button id="btn-analisar" class="primary" onclick="analisar()">🔍 ANALISAR POTENCIAL</button>
        
        <div id="resultado"></div>
        <hr>
        <button onclick="abrirHistorico()">📜 HISTÓRICO</button>
        <button onclick="exportarCSV()">📊 EXPORTAR CSV</button>
        <button onclick="ativarModoAmostra()">📍 MARCAR AMOSTRA</button>
        <button onclick="toggleRota()">🛣️ ROTA OSRM</button>
        <button onclick="ativarDetectorismo()" style="color:#00ff88; border-color:#00ff88;">⛏ DETECTORISMO</button>
        <button onclick="abrir3D()" style="color:#ffcc00; border-color:#ffcc00;">📦 SIMULAÇÃO 3D</button>
        <button onclick="gerarPDF()">📄 GERAR PDF</button>
    </div>
    
    <div id="modalHistorico" class="modal"><div class="modal-content"><span class="close" onclick="fecharModal('modalHistorico')">&times;</span><h2>Histórico</h2><div id="listaHistorico"></div></div></div>
    <div id="modal3D" class="modal"><div class="modal-content" style="height: 80%; display: flex; flex-direction: column;"><span class="close" onclick="fecharModal('modal3D')">&times;</span><h2>Simulação 3D</h2><div id="canvas3d" style="flex: 1; background: #000; border-radius: 4px; overflow: hidden;"></div></div></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
